name = "mobix"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Worker phục vụ luôn frontend (build từ apps/web), chỉ /api/* chạy qua Worker
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Tạo thật khi deploy:
#   npx wrangler d1 create mobix-db       -> điền database_id
#   npx wrangler kv namespace create CART -> điền id
[[d1_databases]]
binding = "DB"
database_name = "store-db"
database_id = "ac7ad5f6-bcc3-4cbc-b5c3-ed3564a9eb29"

[[kv_namespaces]]
binding = "CART"
id = "2a188f870d644bccb27c4d67992b13fb"
